name: Diagnostic rafales PE-AROME (à la main)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Interroger Météo-France (journal seulement, rien n'est publié)
        env:
          METEOFRANCE_PAQUET_API_KEY: ${{ secrets.METEOFRANCE_PAQUET_API_KEY }}
        run: python scripts/diagnostic_rafales.py
