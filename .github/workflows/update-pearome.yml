name: Mise à jour PEAROME (probabilités)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Reconstruire même si ce run est déjà publié
        type: boolean
        default: false
  schedule:
    - cron: "23,53 * * * *"

permissions:
  contents: write

concurrency:
  group: update-pearome
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Récupérer les probabilités PEAROME
        env:
          METEOFRANCE_PAQUET_API_KEY: ${{ secrets.METEOFRANCE_PAQUET_API_KEY }}
          FORCE: ${{ inputs.force }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$METEOFRANCE_PAQUET_API_KEY" ]; then
            echo "::warning title=Secret manquant::Ajoutez METEOFRANCE_PAQUET_API_KEY dans Settings > Secrets and variables > Actions pour activer PEAROME."
            exit 0
          fi
          args=()
          if [ "$FORCE" = 'true' ]; then args+=(--force); fi
          python scripts/update_pearome.py \
            --output-dir build/pearome \
            --current-index-url "https://raw.githubusercontent.com/$REPOSITORY/data/index.json" \
            "${args[@]}"

      - name: Publier sur la branche data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build/pearome/index.json ]; then
            echo "Rien de nouveau à publier."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/pearome")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          assert index["status"] == "ok"
          assert index["products"], "aucun produit"
          for product in index["products"]:
              assert (root / product["file"]).is_file(), product["file"]
          print("Validation OK :", len(index["products"]), "produits, run", index["run_time"])
          PY
          publish_dir="$(mktemp -d)"
          cp -R build/pearome/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git init -q -b data "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -q -m "PEAROME $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Branche de publication écrasée à chaque run : seul le dernier run est utile, pas d'historique à garder.
          git -C "$publish_dir" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data
          echo "Prévisions publiées dans https://github.com/${GITHUB_REPOSITORY}/tree/data" >> "$GITHUB_STEP_SUMMARY"
